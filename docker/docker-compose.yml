version: '3.8'

services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: philomatrix_backend
    restart: unless-stopped
    env_file:
      - ../backend/.env
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: philomatrix_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
